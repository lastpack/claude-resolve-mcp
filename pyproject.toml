[project]
name = "claude-resolve-mcp"
version = "0.1.0"
description = "Edit in DaVinci Resolve (incl. the free version) with Claude: Lua bridge + MCP server + editing tools"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
resolve-mcp = "resolve_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resolve_mcp"]
